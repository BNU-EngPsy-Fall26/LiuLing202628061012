<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结果 · 守灯者</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261104d">
<style>
  body { overflow-y: auto; }
  .result-wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  .result-card {
    background: rgba(8, 14, 22, 0.92);
    border: 3px solid #C8A44A;
    padding: 28px 32px;
    margin-bottom: 28px;
  }
  .result-card h2 { font-size: 24px; color: #f4d084; margin-bottom: 20px; }
  .result-card h3 { font-size: 16px; color: #c9d9e8; margin: 22px 0 12px; }
  .muted { color: #8b9bb4; font-size: 14px; line-height: 1.9; }
  table.rt { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.rt th, table.rt td {
    border: 1px solid rgba(74,123,167,0.5);
    padding: 10px 12px;
    text-align: center;
  }
  table.rt th { background: rgba(74,123,167,0.18); color: #f4d084; }
  .bar-row { display: flex; align-items: center; gap: 12px; margin: 10px 0; font-size: 14px; }
  .bar-label { width: 190px; color: #c9d9e8; flex: 0 0 auto; }
  .bar-track { flex: 1 1 auto; height: 22px; background: rgba(255,255,255,0.06); border: 1px solid rgba(74,123,167,0.4); }
  .bar-fill { height: 100%; background: #C8A44A; }
  .bar-val { width: 90px; text-align: right; color: #f4d084; flex: 0 0 auto; }
  .verdict { padding: 12px 16px; margin: 10px 0; border-left: 4px solid #4A7BA7; background: rgba(74,123,167,0.1); font-size: 14px; line-height: 1.9; color: #c9d9e8; }
  .verdict.yes { border-color: #6ad48a; }
  .verdict.no { border-color: #ef7b7b; }
  .btn-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
</style>
</head>
<body>
  <div class="result-wrap">
    <h1 class="title" style="font-size:36px;">值班报告</h1>
    <p class="muted" style="text-align:center; margin-bottom: 32px;">
      个人数据来自本机记录；汇总数据来自注意实验室匿名接口。
    </p>

    <div id="status" class="muted" style="text-align:center; margin-bottom: 24px;">正在读取数据…</div>

    <div id="exp1-card" class="result-card" style="display:none;">
      <h2>实验一 · 海域搜索</h2>
      <div id="exp1-own"></div>
      <h3>本人搜索斜率（毫秒 / 项目）</h3>
      <div id="exp1-slopes"></div>
      <h3>假设检验（主指标：中位发现时间）</h3>
      <div id="exp1-verdicts"></div>
      <h3>项目匿名汇总</h3>
      <div id="exp1-group"></div>
    </div>

    <div id="exp2-card" class="result-card" style="display:none;">
      <h2>实验二 · 值守海图变化检测</h2>
      <div id="exp2-own"></div>
      <h3>描述性指标：发现率（主指标为发现时间与定位误差）</h3>
      <div id="exp2-rates"></div>
      <h3>假设检验</h3>
      <div id="exp2-verdicts"></div>
      <h3>项目匿名汇总</h3>
      <div id="exp2-group"></div>
    </div>

    <div class="result-card">
      <h2>说明与限制</h2>
      <p class="muted">
        样本量为课程小样本，结果仅用于教学演示，不用于推断总体规律。<br>
        实验二未设置无变化捕捉试次，因此不报告误报率与辨别力 d′。<br>
        显示环境、屏幕亮度与色域差异可能影响颜色对比条件的表现。
      </p>
      <div class="btn-row">
        <button class="btn ghost" onclick="location.href='index.html'">返回首页</button>
        <button class="btn ghost" onclick="location.reload()">刷新数据</button>
      </div>
    </div>
  </div>

  <script src="js/resultpage.js?v=20261104d"></script>
</body>
</html>
