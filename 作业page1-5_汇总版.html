    const PAGE_TITLES = {

  "page2.html": "难度设置",

    const frameHost = document.getElementById('frameHost');
    let currentQuery = '';
    let bundleSession = null;
    let initialized = false;

    function decodeBase64Utf8(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);

      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }

      return new TextDecoder('utf-8').decode(bytes);
    }

    function normalizePageName(pageName) {
      const value = String(pageName || 'index.html').split(/[?#]/)[0];
      const fileName = value.split('/').pop();
      return PAGE_SOURCES[fileName] ? fileName : null;
    }

    function navigateToPage(pageName, query) {
      const fileName = normalizePageName(pageName);

      if (!fileName) {
        throw new Error('Unknown bundled page: ' + pageName);
      }

      currentQuery = String(query || '').replace(/^\?/, '');
      const source = decodeBase64Utf8(PAGE_SOURCES[fileName]);
      const pageFrame = document.createElement('iframe');

      pageFrame.id = 'pageFrame';
      pageFrame.title = '信号检测论交互式实验室';
      pageFrame.srcdoc = source;
      frameHost.replaceChildren(pageFrame);
      document.title = PAGE_TITLES[fileName] + ' · 信号检测论交互式实验室';
      pageFrame.dataset.page = fileName;
    }

    window.__bundleGetQuery = function() {
      return currentQuery;
    };

    window.__bundleSetSession = function(value) {
      bundleSession = JSON.parse(JSON.stringify(value));
    };

    window.__bundleGetSession = function() {
      return bundleSession ? JSON.stringify(bundleSession) : null;
    };

    window.navigateToPage = navigateToPage;

    function initializeBundle() {
      if (initialized) {
        return;
      }

      initialized = true;
      navigateToPage('index.html', '');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeBundle, { once: true });
    } else {
      initializeBundle();
    }
